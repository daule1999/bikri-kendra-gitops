apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bikri-local
resources:
  - ../../base
configMapGenerator:
  - name: backend-config
    behavior: merge
    literals:
      - DB_HOST=host.k3d.internal   # k3s bare-metal: host LAN IP
      - DB_PORT=3306
# ── DEPLOYS HAPPEN HERE ── bump newTag, commit, ArgoCD syncs.
images:
  - name: ghcr.io/<org>/vy/bikri-backend
    newTag: main
