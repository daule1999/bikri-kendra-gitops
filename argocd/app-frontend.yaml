apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend
  namespace: argocd
spec:
  project: bikri
  source:
    repoURL: https://github.com/<org>/bikri-gitops.git
    targetRevision: main
    path: apps/frontend/overlays/local
  destination:
    server: https://kubernetes.default.svc
    namespace: bikri-local
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
